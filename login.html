<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Login — Boxing Timer</title>
</head>
<body>
    <nav class="navbar">
        <div class="navbar__container">
            <a href="index.html" class="navbar__brand">
                <span class="navbar__glove">🥊</span>
                <span class="navbar__brandtext">
                    <span class="navbar__title">BOXING</span>
                    <span class="navbar__subtitle">TIMER</span>
                </span>
            </a>
            <ul class="navbar__links">
                <li><a href="index.html" class="navbar__link">Timer</a></li>
                <li><a href="history.html" class="navbar__link">History</a></li>
                <li><a href="stats.html" class="navbar__link">Stats</a></li>
                <li><a href="settings.html" class="navbar__link">Settings</a></li>
            </ul>
            <a href="login.html" class="button"><i class="fa-regular fa-user"></i> Login</a>
        </div>
    </nav>

    <main class="auth">
        <div class="auth__grid">
            <!-- Login -->
            <div class="auth__panel">
                <h1 class="auth__title">Welcome Back</h1>
                <p class="auth__subtitle">Login to continue your training</p>

                <form id="loginForm">
                    <div class="field">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••••••" required>
                    </div>
                    <div class="field__forgot"><a href="#">Forgot password?</a></div>
                    <button type="submit" class="btn btn--full">Login</button>
                </form>

                <div class="auth__or">or continue with</div>
                <div class="auth__social">
                    <button type="button" class="social-btn" aria-label="Continue with Google">G</button>
                    <button type="button" class="social-btn" aria-label="Continue with Apple"></button>
                </div>
            </div>

            <!-- Register -->
            <div class="auth__panel">
                <h1 class="auth__title">Create Account</h1>
                <p class="auth__subtitle">Join and start your boxing journey</p>

                <form id="registerForm">
                    <div class="field">
                        <label for="registerName">Full Name</label>
                        <input type="text" id="registerName" placeholder="John Doe" required>
                    </div>
                    <div class="field">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" placeholder="••••••••••••" required>
                    </div>
                    <button type="submit" class="btn btn--full">Register</button>
                </form>

                <div class="auth__or">or continue with</div>
                <div class="auth__social">
                    <button type="button" class="social-btn" aria-label="Continue with Google">G</button>
                    <button type="button" class="social-btn" aria-label="Continue with Apple"></button>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div>&copy; 2024 Boxing Timer. All rights reserved.</div>
        <div class="site-footer__links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Use</a>
            <a href="#">Contact</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>

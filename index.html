<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Boxing Timer</title>
</head>
<body>
    <!-- Navbar section-->
    <nav class = "navbar">
        <div class = "navbar__container">
            <div class = "logo_container">
                <img href="index.html" src="logo.png" alt="Logo" class = "navbar__logo">
            </div>

            <ul class = "navbar__right">
                <li class = "navbar__btn">
                    <a href="index.html" class = "button"><i class="fa-regular fa-user"></i> Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <!--- Timer -->
    <div class="timer">
        <div class="timer_container">  
            <div id="timerDisplay">00:00</div>
            <div id="roundDisplay">Round: 0</div>
            <button id="pauseResumeBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <!-- timer input Section -->
    <div class="input">
        <div class="input__container">
            <form id="timerForm">
                <div class="input__group">
                    <label for="rounds">Rounds:</label>
                    <input type="number" id="rounds" name="rounds" min="1" value="3" required><br><br>
                </div>

                <div class="input__group">
                    <label for="roundTime">Round Time (seconds):</label>
                    <input type="number" id="roundTime" name="roundTime" min="1" value="180" required><br><br>
                </div>

                <div class="input__group">
                    <label for="restTime">Rest Time (seconds):</label>
                    <input type="number" id="restTime" name="restTime" min="1" value="60" required><br><br>
                </div>

                <button type="submit">Start Timer</button>
            </form>
        </div>
    </div>

    <!-- Workout History Section -->
<div class="history">
    <div class="history__container">
        <h2 class="history__title">Workout History</h2>
        <table class="history__table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Rounds</th>
                    <th>Length</th>
                    <th>Rest</th>
                    <th>Set Again</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- rows get inserted here by JS -->
            </tbody>
        </table>
    </div>
</div>

    <script src="script.js"></script>

</body>
</html>
